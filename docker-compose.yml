services:
  db:
    image: neo4j:5.26-community
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nsql1h26-gps-backend:1.0
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - NEO4J_HOST=db
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - AUTH_SECRET=${AUTH_SECRET:-secret}
      - PORT=8081
      - UPLOADS_DIR=/app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      - db

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    restart: on-failure
    profiles: ["etl"]
    environment:
      - NEO4J_HOST=db
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    volumes:
      - ./data:/app/data:ro
    command: ["/app/etl", "/app/data/osm/map.osm.pbf"]
    depends_on:
      db:
        condition: service_healthy

  hello_world:
    build:
      context: .
      dockerfile: hello_world/Dockerfile
    restart: "no"
    profiles: ["hello_world"]
    environment:
      - NEO4J_HOST=db
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
    volumes:
      - ./testdata:/app/testdata:ro
    command: ["/app/hello_world", "/app/testdata/osm/monaco.osm.pbf"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  uploads:
