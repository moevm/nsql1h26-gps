version: '3.8'

services:
  neo4j:
    image: neo4j:4.4.48-community
    container_name: neo4j_db
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" 
      - "${NEO4J_BOLT_PORT:-7687}:7687" 
    environment:
    # В дальнейшем по хорошему создавать под приложение своего пользователя
    # TODO: create user for etl and main app
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-secretpassword} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
  hello_world:
    build:
      context: .                   
      dockerfile: hello_world/Dockerfile
    container_name: hello_world
    restart: on-failure
    environment:
      - NEO4J_HOST=neo4j
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./testdata:/app/testdata
    command: ["/app/hello_world", "/app/testdata/osm/monaco.osm.pbf"]
    depends_on:
      neo4j:
        condition: service_healthy

  etl:
    build:
      context: .                   
      dockerfile: etl/Dockerfile
    container_name: etl
    restart: on-failure
    environment:
      - NEO4J_HOST=neo4j
      - NEO4J_BOLT_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
    command: ["/app/etl", "/app/data/osm/map.osm.pbf"]
    depends_on:
      neo4j:
        condition: service_healthy
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: