enum UserStatus {
  ACTIVE
  BANNED
}

enum QuestStatus {
  AVAILABLE
  IN_PROGRESS
  COMPLETED
  FAILED
}

type VisitedProperties @relationshipProperties {
  firstVisited: DateTime!
  lastVisited: DateTime!
  visitCount: Int! @default(value: 1)
}

type DiscoveredProperties @relationshipProperties {
  timestamp: DateTime!
}

type QuestStatusProperties @relationshipProperties {
  status: QuestStatus!
  progress: Float
  startedAt: DateTime!
  completedAt: DateTime
}

type UnlockedProperties @relationshipProperties {
  unlockedAt: DateTime!
}

type User @node {
  id: ID! @id
  username: String!
  passwordHash: String!
  location: Point
  status: UserStatus! @default(value: ACTIVE)
  note: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])

  visitedCells: [Cell!]! @relationship(type: "VISITED", direction: OUT, properties: "VisitedProperties")
  discoveredPOIs: [POI!]! @relationship(type: "DISCOVERED", direction: OUT, properties: "DiscoveredProperties")
  quests: [Quest!]! @relationship(type: "HAS_STATUS", direction: OUT, properties: "QuestStatusProperties")
  achievements: [Achievement!]! @relationship(type: "UNLOCKED", direction: OUT, properties: "UnlockedProperties")
  logs: [EventLog!]! @relationship(type: "GENERATED", direction: OUT)
}

type Cell @node {
  index: String! 
  resolution: Int! @default(value: 9)
  
  pois: [POI!]! @relationship(type: "CONTAINS", direction: OUT)
  visitors: [User!]! @relationship(type: "VISITED", direction: IN, properties: "VisitedProperties")
}

type POI @node {
  id: ID! @id
  name: String!
  type: String!
  description: String
  tags: String!
  location: Point! 
  note: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])

  cell: Cell @relationship(type: "CONTAINS", direction: IN)
}

type Quest @node {
  id: ID! @id
  name: String!
  description: String
  reward: String
  duration: String
  triggerRules: String 
  note: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])

  prerequisites: [Quest!]! @relationship(type: "PREREQUISITE_FOR", direction: IN)
  blockedQuests: [Quest!]! @relationship(type: "PREREQUISITE_FOR", direction: OUT)
}

type Achievement @node {
  id: ID! @id
  name: String!
  description: String
  reward: String
  triggerRules: String
  note: String
  createdAt: DateTime! @timestamp(operations: [CREATE])
  updatedAt: DateTime! @timestamp(operations: [CREATE, UPDATE])

  requiredQuests: [Quest!]! @relationship(type: "REQUIRES_QUEST", direction: OUT)
  prerequisites: [Achievement!]! @relationship(type: "DEPENDS_ON", direction: OUT)
}

type EventLog @node {
  id: ID! @id
  type: String!
  description: String
  details: String 
  timestamp: DateTime! @timestamp(operations: [CREATE])

  user: User @relationship(type: "GENERATED", direction: IN)
}